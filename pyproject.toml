[project]
name = "spend-ledger"
version = "1.1.0"
description = "Spend Ledger monorepo dev environment"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "structlog>=24.4",
    "python-multipart>=0.0.9",
    "pyjwt>=2.10",
    "pwdlib[argon2]>=0.2",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "celery[redis]>=5.4",
    "redis>=5.2",
    "openpyxl>=3.1",
    "tenacity>=9.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "pre-commit>=4.0",
    "pyyaml>=6.0",
    "pyinstrument>=5.0",
]

[tool.uv]
package = false

services:
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - spend-ledger-net

  export-api:
    build:
      context: ./services/export
      dockerfile: ../../infra/docker/python-service.Dockerfile
      args:
        PORT: "8003"
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      EXPORT_FILES_DIR: ${EXPORT_FILES_DIR:-/data/exports}
      LEDGER_SERVICE_URL: ${LEDGER_SERVICE_URL:-http://ledger-service:8002}
      PORT: ${EXPORT_PORT:-8003}
    volumes:
      - export_files:/data/exports
    depends_on:
      redis:
        condition: service_healthy
      ledger-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:'+os.environ['PORT']+'/health')\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - spend-ledger-net

  export-worker:
    build:
      context: ./services/export
      dockerfile: ../../infra/docker/python-service.Dockerfile
      args:
        PORT: "8003"
    command: ["uv", "run", "celery", "-A", "app.jobs.task:celery_app", "worker", "--loglevel=info"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      EXPORT_FILES_DIR: ${EXPORT_FILES_DIR:-/data/exports}
      LEDGER_SERVICE_URL: ${LEDGER_SERVICE_URL:-http://ledger-service:8002}
    volumes:
      - export_files:/data/exports
    depends_on:
      redis:
        condition: service_healthy
      ledger-service:
        condition: service_healthy
    networks:
      - spend-ledger-net

  flower:
    image: mher/flower:2.0
    command: celery --broker=${REDIS_URL:-redis://redis:6379/0} flower --port=5555
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - spend-ledger-net

volumes:
  export_files:
  redis_data:

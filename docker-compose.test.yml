services:
  postgres-auth:
    volumes: !reset []
    environment:
      POSTGRES_USER: spend_auth_test
      POSTGRES_PASSWORD: test_auth
      POSTGRES_DB: auth_db_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spend_auth_test -d auth_db_test"]
    tmpfs:
      - /var/lib/postgresql/data

  postgres-ledger:
    volumes: !reset []
    environment:
      POSTGRES_USER: spend_ledger_test
      POSTGRES_PASSWORD: test_ledger
      POSTGRES_DB: ledger_db_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spend_ledger_test -d ledger_db_test"]
    tmpfs:
      - /var/lib/postgresql/data

  auth-service:
    environment:
      AUTH_DATABASE_URL: postgresql+asyncpg://spend_auth_test:test_auth@postgres-auth:5432/auth_db_test

  ledger-service:
    environment:
      LEDGER_DATABASE_URL: postgresql+asyncpg://spend_ledger_test:test_ledger@postgres-ledger:5432/ledger_db_test

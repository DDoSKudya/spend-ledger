name: spend-ledger

services:
  nginx:
    build:
      context: ./infra
      dockerfile: docker/nginx.Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/certs:/etc/nginx/certs:ro
    depends_on:
      frontend:
        condition: service_started
        required: false
      frontend-dev:
        condition: service_started
        required: false
      bff:
        condition: service_healthy
    networks:
      - spend-ledger-net

  frontend:
    profiles: [prod]
    build:
      context: ./frontend
      target: production
    expose:
      - "3000"
    networks:
      - spend-ledger-net

  frontend-dev:
    profiles: [dev]
    build:
      context: ./frontend
      target: development
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "3000"]
    networks:
      spend-ledger-net:
        aliases:
          - frontend

  bff:
    build:
      context: .
      dockerfile: infra/docker/python-service.Dockerfile
      args:
        SERVICE_DIR: services/bff
        PORT: "8000"
    expose:
      - "8000"
    volumes:
      - ./packages/spend-ledger-common:/packages/spend-ledger-common
      - ./services/bff/app:/app/app
      - ./services/bff/tests:/app/tests
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth-service:8001}
      LEDGER_SERVICE_URL: ${LEDGER_SERVICE_URL:-http://ledger-service:8002}
      EXPORT_SERVICE_URL: ${EXPORT_SERVICE_URL:-http://export-api:8003}
      EXPORT_ENABLED: ${EXPORT_ENABLED:-true}
      JWT_SECRET: ${JWT_SECRET:-change_me}
      PORT: ${BFF_PORT:-8000}
    command:
      [
        "sh",
        "-c",
        "uv run uvicorn app.main:app --host 0.0.0.0 --port $$PORT --reload",
      ]
    depends_on:
      auth-service:
        condition: service_healthy
      ledger-service:
        condition: service_healthy
      export-api:
        condition: service_healthy
        required: false
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:'+os.environ['PORT']+'/ready')\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - spend-ledger-net

  auth-service:
    build:
      context: .
      dockerfile: infra/docker/python-service.Dockerfile
      args:
        SERVICE_DIR: services/auth
        PORT: "8001"
    volumes:
      - ./packages/spend-ledger-common:/packages/spend-ledger-common
      - ./services/auth/app:/app/app
      - ./services/auth/tests:/app/tests
      - ./services/auth/alembic:/app/alembic
      - ./services/auth/alembic.ini:/app/alembic.ini
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AUTH_DATABASE_URL: ${AUTH_DATABASE_URL:-postgresql+asyncpg://spend_auth:change_me_auth@postgres-auth:5432/auth_db}
      JWT_SECRET: ${JWT_SECRET:-change_me}
      JWT_ACCESS_EXPIRE_MINUTES: ${JWT_ACCESS_EXPIRE_MINUTES:-15}
      JWT_REFRESH_EXPIRE_DAYS: ${JWT_REFRESH_EXPIRE_DAYS:-7}
      PORT: ${AUTH_PORT:-8001}
    command:
      [
        "sh",
        "-c",
        "uv run uvicorn app.main:app --host 0.0.0.0 --port $$PORT --reload",
      ]
    depends_on:
      postgres-auth:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:'+os.environ['PORT']+'/ready')\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - spend-ledger-net

  ledger-service:
    build:
      context: .
      dockerfile: infra/docker/python-service.Dockerfile
      args:
        SERVICE_DIR: services/ledger
        PORT: "8002"
    expose:
      - "8002"
    volumes:
      - ./packages/spend-ledger-common:/packages/spend-ledger-common
      - ./services/ledger/app:/app/app
      - ./services/ledger/tests:/app/tests
      - ./services/ledger/alembic:/app/alembic
      - ./services/ledger/alembic.ini:/app/alembic.ini
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LEDGER_DATABASE_URL: ${LEDGER_DATABASE_URL:-postgresql+asyncpg://spend_ledger:change_me_ledger@postgres-ledger:5432/ledger_db}
      SQLALCHEMY_ECHO: ${SQLALCHEMY_ECHO:-true}
      PROFILE_REQUESTS: ${PROFILE_REQUESTS:-false}
      ENABLE_PYINSTRUMENT: ${ENABLE_PYINSTRUMENT:-false}
      PORT: ${LEDGER_PORT:-8002}
    command:
      [
        "sh",
        "-c",
        "uv run uvicorn app.main:app --host 0.0.0.0 --port $$PORT --reload",
      ]
    depends_on:
      postgres-ledger:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:'+os.environ['PORT']+'/ready')\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - spend-ledger-net

  postgres-auth:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_AUTH_USER:-spend_auth}
      POSTGRES_PASSWORD: ${POSTGRES_AUTH_PASSWORD:-change_me_auth}
      POSTGRES_DB: ${POSTGRES_AUTH_DB:-auth_db}
    volumes:
      - auth_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_AUTH_USER:-spend_auth} -d ${POSTGRES_AUTH_DB:-auth_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - spend-ledger-net

  postgres-ledger:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_LEDGER_USER:-spend_ledger}
      POSTGRES_PASSWORD: ${POSTGRES_LEDGER_PASSWORD:-change_me_ledger}
      POSTGRES_DB: ${POSTGRES_LEDGER_DB:-ledger_db}
    volumes:
      - ledger_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_LEDGER_USER:-spend_ledger} -d ${POSTGRES_LEDGER_DB:-ledger_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - spend-ledger-net

  redis:
    profiles: [export]
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - spend-ledger-net

  export-api:
    profiles: [export]
    build:
      context: .
      dockerfile: infra/docker/python-service.Dockerfile
      args:
        SERVICE_DIR: services/export
        PORT: "8003"
    volumes:
      - ./packages/spend-ledger-common:/packages/spend-ledger-common
      - ./services/export/app:/app/app
      - ./services/export/tests:/app/tests
      - export_files:/data/exports
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      EXPORT_FILES_DIR: ${EXPORT_FILES_DIR:-/data/exports}
      LEDGER_SERVICE_URL: ${LEDGER_SERVICE_URL:-http://ledger-service:8002}
      PORT: ${EXPORT_PORT:-8003}
    depends_on:
      redis:
        condition: service_healthy
      ledger-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:'+os.environ['PORT']+'/ready')\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - spend-ledger-net

  export-worker:
    profiles: [export]
    build:
      context: .
      dockerfile: infra/docker/python-service.Dockerfile
      args:
        SERVICE_DIR: services/export
        PORT: "8003"
    command: ["uv", "run", "celery", "-A", "app.jobs.task:celery_app", "worker", "--loglevel=info"]
    volumes:
      - ./packages/spend-ledger-common:/packages/spend-ledger-common
      - ./services/export/app:/app/app
      - ./services/export/tests:/app/tests
      - export_files:/data/exports
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      EXPORT_FILES_DIR: ${EXPORT_FILES_DIR:-/data/exports}
      LEDGER_SERVICE_URL: ${LEDGER_SERVICE_URL:-http://ledger-service:8002}
    depends_on:
      redis:
        condition: service_healthy
      ledger-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "uv run celery -A app.jobs.task:celery_app inspect ping -d celery@$$HOSTNAME --timeout 5 2>/dev/null | grep -q OK",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - spend-ledger-net

  flower:
    profiles: [export, dev]
    image: mher/flower:2.0
    ports:
      - "127.0.0.1:5555:5555"
    command: celery --broker=${REDIS_URL:-redis://redis:6379/0} flower --port=5555
    expose:
      - "5555"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - spend-ledger-net

  postgres-integration:
    profiles: [integration]
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: spend_ledger_test
      POSTGRES_PASSWORD: test_ledger
      POSTGRES_DB: ledger_db_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spend_ledger_test -d ledger_db_test"]
      interval: 5s
      timeout: 5s
      retries: 5
    tmpfs:
      - /var/lib/postgresql/data

  postgres-auth-integration:
    profiles: [integration]
    image: postgres:16-alpine
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: spend_auth_test
      POSTGRES_PASSWORD: test_auth
      POSTGRES_DB: auth_db_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spend_auth_test -d auth_db_test"]
      interval: 5s
      timeout: 5s
      retries: 5
    tmpfs:
      - /var/lib/postgresql/data

networks:
  spend-ledger-net:
    name: spend-ledger-net

volumes:
  auth_data:
  ledger_data:
  export_files:
  redis_data:

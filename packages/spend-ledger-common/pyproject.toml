[project]
name = "spend-ledger-common"
version = "1.0.0"
description = "Shared utilities for Spend Ledger services"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "sqlalchemy[asyncio]>=2.0.36",
    "structlog>=24.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spend_ledger_common"]

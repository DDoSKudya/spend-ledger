name: CI

on:
  push:
    branches: [main, master, develop, feature/*]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [bff, auth, ledger, export]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and test
        working-directory: services/${{ matrix.service }}
        run: |
          uv sync --dev
          uv run pytest
          uv run ruff check app tests --config ../../ruff.toml
          uv run ruff format --check app tests --config ../../ruff.toml

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Lint and build
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

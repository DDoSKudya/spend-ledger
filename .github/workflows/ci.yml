name: CI

on:
  push:
    branches: [main, master, develop, feature/*]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [bff, auth, export]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and test
        working-directory: services/${{ matrix.service }}
        run: |
          uv sync --dev
          uv run pytest
          uv run ruff check app tests --config ../../ruff.toml
          uv run ruff format --check app tests --config ../../ruff.toml

  ledger:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ledger_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d ledger_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install, migrate, test
        working-directory: services/ledger
        env:
          LEDGER_DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/ledger_test
          LEDGER_INTEGRATION: "1"
          APP_ENV: test
        run: |
          uv sync --dev
          uv run alembic upgrade head
          uv run pytest
          uv run ruff check app tests --config ../../ruff.toml
          uv run ruff format --check app tests --config ../../ruff.toml

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Lint and build
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

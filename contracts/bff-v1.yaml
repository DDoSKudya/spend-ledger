openapi: 3.1.0
info:
  title: Spend Ledger BFF
  version: 1.0.0
paths:
  /api/v1/auth/register:
    post:
      summary: Register account
      responses:
        "201":
          description: Created
  /api/v1/auth/login:
    post:
      summary: Login and set refresh cookie
      responses:
        "200":
          description: OK
  /api/v1/auth/refresh:
    post:
      summary: Refresh access token using httpOnly cookie
      responses:
        "200":
          description: OK
  /api/v1/auth/logout:
    post:
      summary: Logout and clear refresh cookie
      responses:
        "204":
          description: No Content
  /api/v1/auth/me:
    get:
      summary: Current user profile
      responses:
        "200":
          description: OK
  /api/v1/health:
    get:
      summary: BFF health
      responses:
        "200":
          description: OK
  /api/v1/categories:
    get:
      summary: List categories
      responses:
        "200":
          description: OK
    post:
      summary: Create category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryCreate"
      responses:
        "201":
          description: Created
  /api/v1/categories/{id}:
    put:
      summary: Update category
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
        "409":
          description: Category in use
    delete:
      summary: Delete category
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Deleted
        "409":
          description: Category in use
  /api/v1/tags:
    get:
      summary: List tags
      responses:
        "200":
          description: OK
    post:
      summary: Create tag
      responses:
        "201":
          description: Created
  /api/v1/tags/{id}:
    patch:
      summary: Rename tag
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
    delete:
      summary: Delete tag
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Deleted
  /api/v1/expenses:
    get:
      summary: List expenses with filters and pagination
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: sort
          in: query
          schema:
            type: string
            default: expense_date:desc
        - name: category_id
          in: query
          schema:
            type: string
            format: uuid
        - name: tag_ids
          in: query
          schema:
            type: array
            items:
              type: string
              format: uuid
        - name: date_from
          in: query
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          schema:
            type: string
            format: date
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Paginated expense list
        "401":
          description: Unauthorized
    post:
      summary: Create expense
      responses:
        "201":
          description: Created
  /api/v1/expenses/{id}:
    get:
      summary: Get expense
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
    put:
      summary: Update expense
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
    delete:
      summary: Delete expense
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Deleted
  /api/v1/reports/monthly:
    get:
      summary: Monthly expense aggregates
      parameters:
        - name: year
          in: query
          schema:
            type: integer
        - name: category_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Monthly report
        "401":
          description: Unauthorized
  /api/v1/exports:
    post:
      summary: Start background export
      responses:
        "202":
          description: Accepted
        "401":
          description: Unauthorized
  /api/v1/exports/{job_id}:
    get:
      summary: Export job status
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
        "401":
          description: Unauthorized
        "404":
          description: Not found
  /api/v1/exports/{job_id}/download:
    get:
      summary: Download export file
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: File stream
        "401":
          description: Unauthorized
        "404":
          description: Not found
  /health:
    get:
      summary: Container healthcheck
      responses:
        "200":
          description: OK
components:
  schemas:
    CategoryCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string

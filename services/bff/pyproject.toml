[project]
name = "spend-ledger-bff"
version = "1.1.0"
description = "Spend Ledger BFF"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "structlog>=24.4",
    "pyjwt>=2.10",
    "python-multipart>=0.0.9",
    "spend-ledger-common",
]

[tool.uv.sources]
spend-ledger-common = { path = "../../packages/spend-ledger-common" }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
omit = [
  "app/main.py",
  "app/clients/*",
  "app/routes/*",
]

[tool.coverage.report]
fail_under = 75
show_missing = true
skip_covered = true

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["../../packages/spend-ledger-common"]

[tool.basedpyright]
venvPath = "."
venv = ".venv"
extraPaths = ["../../packages/spend-ledger-common"]
